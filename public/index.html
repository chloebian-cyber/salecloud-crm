  <aside class="drawer" id="drawer" aria-label="Lead details"><div class="drawer-head"><div><div class="drawer-kicker">LEAD PROFILE</div><div class="drawer-title">Lead details</div></div><button class="icon-button" id="closeDrawer" aria-label="Close lead details">✕</button></div><div class="drawer-body" id="drawerBody"></div><div class="drawer-footer" id="drawerFooter"></div></aside>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Create a new lead</h2><button class="icon-button" id="closeModal" aria-label="Close">✕</button></div><form id="leadForm"><div class="modal-content"><div class="form-grid"><div class="field"><label for="fName">Full name *</label><input id="fName" name="name" required placeholder="e.g. Avery Johnson"></div><div class="field"><label for="fCompany">Company *</label><input id="fCompany" name="company" required placeholder="Company name"></div><div class="field"><label for="fTitle">Job title</label><input id="fTitle" name="title" placeholder="e.g. VP of Sales"></div><div class="field"><label for="fEmail">Work email</label><input id="fEmail" name="email" type="email" placeholder="name@company.com"></div><div class="field"><label for="fPhone">Phone</label><input id="fPhone" name="phone" placeholder="+1 (555) 000-0000"></div><div class="field"><label for="fSource">Lead source</label><select id="fSource" name="source"><option>Website</option><option>LinkedIn</option><option>Referral</option><option>Webinar</option><option>Partner</option><option>Outbound</option><option>Event</option></select></div><div class="field"><label for="fStatus">Status</label><select id="fStatus" name="status"><option>New</option><option>Working</option><option>Nurturing</option><option>Qualified</option></select></div><div class="field"><label for="fValue">Estimated value</label><input id="fValue" name="estimatedValue" type="number" min="0" placeholder="25000"></div><div class="field full"><label for="fNext">Next step</label><input id="fNext" name="nextStep" placeholder="e.g. Schedule a discovery call"></div></div></div><div class="modal-foot"><button type="button" class="button" id="cancelModal">Cancel</button><button class="button primary" type="submit" id="saveLeadBtn">Create lead</button></div></form></section></div>
  <div class="modal-backdrop" id="touchpointBackdrop"><section class="modal wide-modal" role="dialog" aria-modal="true" aria-labelledby="touchpointTitle"><div class="modal-head"><div><h2 id="touchpointTitle">Log a trial touchpoint</h2><div class="panel-subtitle" style="margin-top:5px">Capture what the user is trying to do and agree on what comes next.</div></div><button class="icon-button" id="closeTouchpoint" aria-label="Close">✕</button></div><form id="touchpointForm"><div class="modal-content"><div class="form-grid"><div class="field"><label for="tpLead">Lead *</label><select id="tpLead" name="leadId" required></select></div><div class="field"><label for="tpSource">Conversation source *</label><select id="tpSource" name="source" required><option value="">Select a source</option><option>Call</option><option>Meeting</option><option>Email</option><option>Chat</option><option>Product session</option><option>Event</option><option>Referral</option><option>Other</option></select></div><div class="field"><label for="tpStage">Usage stage *</label><select id="tpStage" name="usageStage" required><option value="pre_trial">Before trial</option><option value="during_trial">During trial</option><option value="after_trial">After trial</option></select></div><div class="field"><label for="tpTask">User task *</label><input id="tpTask" name="userTask" required placeholder="What are they trying to accomplish?"></div><div class="field"><label for="tpInput">Input to use <span class="stage-hint">· required before trial</span></label><input id="tpInput" name="taskInput" placeholder="Data, file, prompt, or starting point"></div><div class="field"><label for="tpExpected">Expected result <span class="stage-hint">· required before trial</span></label><input id="tpExpected" name="expectedResult" placeholder="What would success look like?"></div><div class="field full"><label for="tpSolution">How they solve this today *</label><textarea id="tpSolution" name="currentSolution" required placeholder="Tools, process, workarounds, and who is involved"></textarea></div><div class="field full stage-during"><label for="tpSteps">Steps completed <span class="stage-hint">· required during trial</span></label><textarea id="tpSteps" name="completedSteps" placeholder="Record the steps the user completed"></textarea></div><div class="field full"><label for="tpObstacle">Specific obstacle or blocker *</label><textarea id="tpObstacle" name="obstacle" required placeholder="Describe it, or enter None observed"></textarea></div><div class="field full stage-during"><label class="check-field"><input id="tpAssist" name="manualAssist" type="checkbox">Needed hands-on help during the trial</label></div><div class="field full"><label for="tpEvidence">Evidence *</label><textarea id="tpEvidence" name="evidence" required placeholder="Quote, observed behavior, screenshot reference, result, or follow-up confirmation"></textarea></div><div class="field full"><label for="tpNext">Agreed next step *</label><input id="tpNext" name="nextStep" required placeholder="The next concrete action for either side"></div><div class="field"><label for="tpDate">Next step date *</label><input id="tpDate" name="nextStepDate" type="date" required></div><div class="field stage-after"><label for="tpContinue">Will they continue using it?</label><select id="tpContinue" name="continuedUse"><option value="unknown">Not checked yet</option><option value="yes">Yes</option><option value="no">No</option></select></div><div class="field full"><label class="check-field"><input id="tpIssue" name="productIssue" type="checkbox">A product issue needs follow-up</label></div><div class="field full issue-fields"><label for="tpRepro">Reproduction details <span class="stage-hint">· required for product issues</span></label><textarea id="tpRepro" name="reproductionInfo" placeholder="Steps, environment, and what happened versus what was expected"></textarea></div><div class="field issue-fields"><label for="tpCoordinator">Who should coordinate?</label><input id="tpCoordinator" name="issueCoordinator" placeholder="Team or owner"></div></div></div><div class="modal-foot"><button type="button" class="button" id="cancelTouchpoint">Cancel</button><button class="button primary" type="submit" id="saveTouchpoint">Save touchpoint</button></div></form></section></div>
  <div class="modal-backdrop" id="signalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="signalTitle"><div class="modal-head"><h2 id="signalTitle">Record an adoption signal</h2><button class="icon-button" id="closeSignal" aria-label="Close">✕</button></div><form id="signalForm"><div class="modal-content"><div class="form-grid"><div class="field full"><label for="signalLead">Lead *</label><select id="signalLead" name="leadId" required></select></div><div class="field"><label for="signalType">Signal *</label><select id="signalType" name="eventType" required><option value="interest">Interest expressed</option><option value="trial_completed">Trial completed</option><option value="repeat_use">Repeated use</option><option value="paid">Paid</option></select></div><div class="field"><label for="signalDate">Date *</label><input id="signalDate" name="occurredOn" type="date" required></div><div class="field full"><label for="signalEvidence">Evidence *</label><textarea id="signalEvidence" name="evidence" required placeholder="What did the user say or do? Include a concrete observation or confirmation."></textarea></div></div></div><div class="modal-foot"><button type="button" class="button" id="cancelSignal">Cancel</button><button type="submit" class="button primary" id="saveSignal">Record signal</button></div></form></section></div>
  <div class="modal-backdrop" id="recordDetailBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="recordDetailTitle"><div class="modal-head"><h2 id="recordDetailTitle">Trial touchpoint</h2><button class="icon-button" id="closeRecordDetail" aria-label="Close">✕</button></div><div class="modal-content" id="recordDetailBody"></div><div class="modal-foot"><button type="button" class="button" id="doneRecordDetail">Done</button></div></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
